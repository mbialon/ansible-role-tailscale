steps:
  - label: ":ansible: Lint"
    command: flox activate -- uv run ansible-lint .
    plugins:
      - docker#v5.13.0:
          image: "ghcr.io/flox/flox:v1.15.0"
          environment:
            - FLOX_DISABLE_METRICS=true
            - UV_FROZEN=1

  - wait: ~

  - label: ":rocket: Release to Galaxy"
    if: build.tag != null
    command: flox activate -- uv run ansible-galaxy role import --api-key "$$GALAXY_API_KEY" mbialon ansible-role-tailscale
    plugins:
      - docker#v5.13.0:
          image: "ghcr.io/flox/flox:v1.15.0"
          environment:
            - FLOX_DISABLE_METRICS=true
            - UV_FROZEN=1
            - GALAXY_API_KEY
    secrets:
      - GALAXY_API_KEY
